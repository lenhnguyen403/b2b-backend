spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: account-service
          uri:
          predicates:
            - Path=/api/v1/

        - id: cif-service
          uri:
          predicates:
            - Path=/api/v1/

        - id: cart-service
          uri:
          predicates:
            - Path=/api/v1/

        - id: order-service
          uri:
          predicates:
            - Path=/api/v1/

        - id: payment-service
          uri:
          predicates:
            - Path=/api/v1/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

server:
  port: 9090